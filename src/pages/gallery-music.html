<!-- GALLERY — MUSIC -->
<section id="gallery-music">
  <!-- Fullscreen background video -->
  <video id="music-bg-video" preload="none" muted loop playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none;transition:opacity 1s ease;"></video>
  <img loading="lazy" decoding="async" id="music-bg-image" src="" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none;opacity:0;transition:opacity 1s ease;">
  <div style="position:absolute;inset:0;background:rgba(0,0,0,0.45);z-index:1;pointer-events:none;"></div>

  <!-- Back button top left — hidden when track panel is open -->
  

  <!-- Left edge tab button -->
  <button id="music-tab-btn" onclick="musicToggleTracklist()" title="Browse Tracks">TRACKS</button>

  <!-- Left panel track list -->
  <div id="music-tracklist-overlay">
    <div class="music-overlay-header">
      <input class="music-search" type="text" placeholder="Search tracks..." oninput="musicSearch(this.value)">
      <span class="music-track-count" id="music-track-count">546 tracks</span>
      <button class="music-ctrl-btn" onclick="musicToggleTracklist()" title="Close" style="flex-shrink:0;border-radius:4px;">✕</button>
    </div>
    <div class="music-list" id="music-list"></div>
  </div>

  <!-- Minimal bottom bar -->
  <div class="music-minimal-bar">
    <div class="music-minimal-left">
      <button class="music-ctrl-btn" onclick="musicPrev()" title="Previous">◀</button>
      <button class="music-ctrl-btn play" id="music-btn-play" onclick="musicTogglePlay()" title="Play/Pause">▶</button>
      <button class="music-ctrl-btn" id="music-btn-stop" onclick="musicStop()" title="Stop">■</button>
      <button class="music-ctrl-btn" onclick="musicNext()" title="Next">▶▶</button>
    </div>
    <div class="music-minimal-center">
      <div class="music-now-playing" id="music-now-playing">Select a track</div>
      <div class="music-minimal-progress" id="music-progress-bar" onclick="musicSeek(event)">
        <div class="music-progress-fill" id="music-progress-fill"></div>
      </div>
      <div class="music-time" id="music-time">0:00 / 0:00</div>
    </div>
    <div class="music-minimal-right">
      <button class="music-ctrl-btn" id="music-btn-shuffle" onclick="musicToggleShuffle()" title="Shuffle">⇄</button>
      <button class="music-ctrl-btn" id="music-btn-loop" onclick="musicToggleLoop()" title="Loop">↺</button>
      <div class="music-vol-wrap">
        <span class="music-vol-icon" onclick="musicToggleMute()">🔊</span>
        <input type="range" class="music-volume" id="music-volume" min="0" max="1" step="0.02" value="0.2" oninput="musicSetVolume(this.value)">
      </div>
    </div>
  </div>
</section>
